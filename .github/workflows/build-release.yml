name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release version used in package names
        required: false
        default: 0.2.0

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts, tests -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw "PowerShell syntax error in $($_.FullName): $($parseErrors -join '; ')" }
          }
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run tests
        run: |
          npm test
          cargo test
      - name: Build Windows package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME.StartsWith('v')) { $env:GITHUB_REF_NAME.Substring(1) } else { $env:PACKAGE_VERSION }
          if (-not $version) { $version = '0.2.0' }
          ./scripts/package.ps1 -Version $version
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.2.0' }}
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/GitHubCopilotZh-*-win-x64.zip
          if-no-files-found: error

  macos:
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Build macOS package
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != v* ]]; then version="$PACKAGE_VERSION"; fi
          if [[ -z "$version" ]]; then version="0.2.0"; fi
          bash scripts/package-macos.sh --version "$version" --target "${{ matrix.target }}"
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.2.0' }}
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/GitHubCopilotZh-*-macos-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo '没有找到发布包。' >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum *.zip > SHA256SUMS.txt
          )
          assets+=(release-assets/SHA256SUMS.txt)
          release_notes=$'Windows x64 为已验证版本。\n\nmacOS arm64/x86_64 为实验包：当前官方生产版 WKWebView 没有稳定公开的 Inspector/CDP 注入接口，因此不保证显示中文。'
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "GitHub Copilot 中文版 ${GITHUB_REF_NAME#v}" --notes "$release_notes"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "GitHub Copilot 中文版 ${GITHUB_REF_NAME#v}" --notes "$release_notes"
          fi
