[package]
name = "copilot-zh"
version = "0.1.0"
edition = "2021"
description = "Unofficial local Simplified Chinese localization launcher for GitHub Copilot App"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tungstenite = "0.26"
ureq = { version = "2.12", features = ["json"] }
url = "2.5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

